name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # repo jest publiczne - build odpala tylko wlasciciel
    if: github.actor == github.repository_owner

    steps:
      - uses: actions/checkout@v4
        with:
          # git-info.gradle (JGit) szuka ostatniego tagu i liczy commity,
          # wiec potrzebuje pelnej historii i tagow
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # AGP 8.6 chce konkretnej wersji NDK (cmake w app/src/main/cpp);
      # instalujemy jawnie, zeby nie polegac na tym, co jest na runnerze
      - name: NDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"

      - name: Konfiguracja podpisywania
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Brak sekretu KEYSTORE_BASE64 - APK bedzie niepodpisany"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "releaseKeystore=$RUNNER_TEMP/release.jks"
            echo "releaseKeystorePassword=$KEYSTORE_PASSWORD"
            echo "releaseKeyAlias=$KEY_ALIAS"
            echo "releaseKeyPassword=$KEY_PASSWORD"
          } >> local.properties

      - name: Build
        run: ./gradlew :app:assembleUnofficialRelease --no-daemon

      - name: Podpis i nazwy plikow
        run: |
          apk=$(ls -t app/release/*.apk | head -1)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" || echo "::warning::APK niepodpisany"
          # te same nazwy co lokalny make: szkolny-<wersja>.apk + staly szkolny.apk
          version=$(basename "$apk" .apk | sed 's/^Edziennik_//')
          cp "$apk" "szkolny-$version.apk"
          cp "$apk" szkolny.apk
          echo "APK=szkolny-$version.apk" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          # na publicznym repo artefakty widzi kazdy - mapping R8 tu nie leci
          # (i tak jest wysylany do Crashlytics przy buildzie)
          name: szkolny-apk
          path: szkolny-*.apk
          retention-days: 30

      # push tagu = trwale wydanie pod tym tagiem
      - name: Wydanie z tagu
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" szkolny.apk \
            --title "$VERSION" --generate-notes

      # kazde inne uruchomienie = odswiezenie wydania kroczacego "latest",
      # zeby link do pobrania byl zawsze ten sam
      - name: Wydanie kroczace
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Build $VERSION, commit ${GITHUB_SHA:0:8}, $(date -u '+%Y-%m-%d %H:%M UTC')"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$APK" szkolny.apk --clobber
            gh release edit latest --title "$VERSION (latest)" --notes "$notes"
          else
            gh release create latest "$APK" szkolny.apk \
              --title "$VERSION (latest)" --notes "$notes" --prerelease
          fi
